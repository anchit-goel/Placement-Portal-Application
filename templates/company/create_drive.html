{% extends 'base.html' %}
{% block title %}Post New Drive{% endblock %}

{% block content %}
<div class="container mt-4">
    <a href="{{ url_for('company.dashboard') }}" class="btn btn-outline-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
    <div class="card p-4">
        <h4 class="mb-4">Post New Placement Drive</h4>
        <form method="POST" action="{{ url_for('company.create_drive') }}">
            <div class="mb-3">
                <label class="form-label">Job Title <span class="text-danger">*</span></label>
                <input type="text" name="job_title" class="form-control" required placeholder="e.g. Software Engineer">
            </div>
            <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea name="job_description" class="form-control" rows="4" placeholder="Describe the role and responsibilities"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Eligibility Criteria</label>
                <textarea name="eligibility" class="form-control" rows="2" placeholder="e.g. CGPA above 7.0, CS/IT branch only"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Required Skills</label>
                <input type="text" name="required_skills" class="form-control" placeholder="e.g. Python, Django, SQL">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Experience Required</label>
                    <input type="text" name="experience_required" class="form-control" placeholder="e.g. Fresher, 0-1 years">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. Bangalore, Remote">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Minimum Salary (LPA)</label>
                    <input type="number" name="salary_min" class="form-control" placeholder="e.g. 5">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Maximum Salary (LPA)</label>
                    <input type="number" name="salary_max" class="form-control" placeholder="e.g. 12">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Application Deadline <span class="text-danger">*</span></label>
                <input type="date" name="deadline" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit for Approval</button>
        </form>
    </div>
</div>
{% endblock %}
