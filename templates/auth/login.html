{% extends 'base.html' %}
{% block title %}Login — CareerConnect{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card card">
                <div class="text-center mb-4">
                    <h3 class="mt-2 fw-bold">CareerConnect</h3>
                    <p class="text-muted small">Sign in to your account</p>
                </div>
                <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Login As</label>
                        <select name="role" class="form-select" required>
                            <option value="">-- Select Role --</option>
                            <option value="admin">Admin</option>
                            <option value="company">Company</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email / Username</label>
                        <input type="text" name="email" class="form-control" required placeholder="Enter email or username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        Login
                    </button>
                </form>
                <hr class="my-4">
                <div class="text-center">
                    <small class="text-muted">New Student? <a href="{{ url_for('auth.register_student') }}" class="text-primary fw-500">Register here</a></small><br>
                    <small class="text-muted">New Company? <a href="{{ url_for('auth.register_company') }}" class="text-primary fw-500">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
